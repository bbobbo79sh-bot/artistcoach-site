<div id="sp-root">
<textarea id="sp-text" rows="10" placeholder="발표 대본을 붙여 넣으세요" aria-label="발표 대본" style="width:100%;box-sizing:border-box;padding:14px 16px;font-size:17px;line-height:1.75;margin:0"></textarea>
<div id="sp-count" style="font-size:13px;color:var(--sub);font-weight:700;margin:6px 2px 16px;min-height:18px"></div>

<div style="background:var(--연함);border:1px solid var(--선);border-radius:18px;padding:18px 18px 16px;text-align:center;margin:0 0 16px">
<div style="font-size:13px;color:var(--sub);font-weight:700">발표 시간</div>
<div id="sp-time" style="font-size:44px;font-weight:900;color:var(--깊음);line-height:1.2;margin:2px 0 2px">0초</div>
<div id="sp-sub" style="font-size:13.5px;color:var(--sub);min-height:20px"></div>
</div>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end">
<div>
<div style="font-size:13px;font-weight:700;margin:0 0 6px">말하는 속도</div>
<div style="display:flex;gap:6px">
<button type="button" class="sp-pre" data-r="270" style="flex:1;padding:10px 4px">천천히</button>
<button type="button" class="sp-pre" data-r="330" style="flex:1;padding:10px 4px;font-weight:900">보통</button>
<button type="button" class="sp-pre" data-r="400" style="flex:1;padding:10px 4px">빠르게</button>
</div>
</div>
<label style="font-size:13px;font-weight:700;display:block">슬라이드 (장)
<input type="number" id="sp-slides" min="0" inputmode="numeric" placeholder="없으면 비워 두세요" style="width:100%;box-sizing:border-box;padding:10px;font-size:16px;margin:6px 0 0">
</label>
</div>
<p style="font-size:12.5px;color:var(--sub);margin:14px 0 0">공백을 뺀 글자 수로 계산해요. 보통은 1분에 330자쯤이에요. 슬라이드는 한 장 넘기는 데 2초를 더해요. 사람마다 다르니 꼭 한 번 소리 내어 재 보세요. 대본은 이 기기 안에서만 계산되고 어디로도 보내지 않아요.</p>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var rate = 330;
  function fmt(n) { return Number(n).toLocaleString('ko-KR'); }
  function mmss(s) {
    s = Math.max(0, Math.round(s));
    var m = Math.floor(s / 60), r = s % 60;
    return m > 0 ? (m + '분 ' + (r < 10 ? '0' : '') + r + '초') : (r + '초');
  }
  function recalc() {
    var t = $('sp-text').value;
    var n = t.replace(/\s/g, '').length;
    var slides = parseFloat($('sp-slides').value);
    slides = isFinite(slides) && slides > 0 ? Math.floor(slides) : 0;
    var talk = n / rate * 60;
    var total = talk + slides * 2;
    $('sp-count').textContent = n ? ('공백 뺀 ' + fmt(n) + '자 · 공백 포함 ' + fmt(t.replace(/\r?\n/g, '').length) + '자') : '';
    $('sp-time').textContent = mmss(total);
    $('sp-sub').textContent = slides ? ('말하기 ' + mmss(talk) + ' + 슬라이드 ' + slides + '장 ' + mmss(slides * 2)) : '';
    document.querySelectorAll('.sp-pre').forEach(function (b) { b.style.fontWeight = Number(b.getAttribute('data-r')) === rate ? '900' : ''; b.style.opacity = Number(b.getAttribute('data-r')) === rate ? '1' : '.5'; });
  }
  $('sp-text').addEventListener('input', recalc);
  $('sp-slides').addEventListener('input', recalc);
  document.querySelectorAll('.sp-pre').forEach(function (b) { b.addEventListener('click', function () { rate = Number(b.getAttribute('data-r')); recalc(); }); });
  recalc();
})();
</script>
</div>
