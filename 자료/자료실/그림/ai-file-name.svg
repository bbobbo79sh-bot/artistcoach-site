<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" width="720" height="384" role="img" aria-label="파일 이름 규칙" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"><title>파일 이름 규칙</title><desc>날짜 6자리, 활동명, 서류 종류 순서로 이름을 붙인다</desc><rect width="720" height="384" rx="22" fill="#FFF9FC"/><text x="360" y="48" font-size="30" font-weight="800" fill="#2B1D1A" text-anchor="middle">파일 이름은 이렇게 바뀌어요</text><rect x="40" y="90" width="640" height="80" rx="18" fill="#FFFFFF" stroke="#D01E7E" stroke-width="3"/><text x="64" y="140" font-size="34" font-weight="800" fill="#D01E7E" text-anchor="start">240518</text><text x="184" y="140" font-size="34" font-weight="800" fill="#2B1D1A" text-anchor="start">_봄소리음악회</text><text x="408" y="140" font-size="34" font-weight="800" fill="#9B1560" text-anchor="start">_출연확인서</text><line x1="121" y1="176" x2="121" y2="214" stroke="#D01E7E" stroke-width="3"/><text x="121" y="246" font-size="25" font-weight="800" fill="#D01E7E" text-anchor="middle">날짜 6자리</text><text x="121" y="278" font-size="21" font-weight="500" fill="#7A6A66" text-anchor="middle">2024년 5월 18일</text><line x1="300" y1="176" x2="300" y2="214" stroke="#2B1D1A" stroke-width="3"/><text x="300" y="246" font-size="25" font-weight="800" fill="#2B1D1A" text-anchor="middle">어떤 활동?</text><text x="300" y="278" font-size="21" font-weight="500" fill="#7A6A66" text-anchor="middle">봄소리음악회</text><line x1="500" y1="176" x2="500" y2="214" stroke="#9B1560" stroke-width="3"/><text x="500" y="246" font-size="25" font-weight="800" fill="#9B1560" text-anchor="middle">무슨 서류?</text><text x="500" y="278" font-size="21" font-weight="500" fill="#7A6A66" text-anchor="middle">출연확인서</text><rect x="100" y="304" width="520" height="56" rx="28" fill="#FBE3EF" stroke="none" stroke-width="2"/><text x="360" y="340" font-size="23" font-weight="700" fill="#9B1560" text-anchor="middle">이름순으로 줄 세우면 시간 순서대로 보여요</text></svg>
