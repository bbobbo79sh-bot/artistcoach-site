<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-label="프롬프트 쓰는 법" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"><title>프롬프트 쓰는 법</title><desc>복사, 붙여넣기, 보내기 세 단계</desc><rect width="720" height="350" rx="22" fill="#FFF9FC"/><text x="360" y="50" font-size="30" font-weight="800" fill="#2B1D1A" text-anchor="middle">AI에게 부탁하는 법은 세 번의 손짓이에요</text><rect x="28" y="90" width="200" height="230" rx="20" fill="#FFFFFF" stroke="#E8D0DC" stroke-width="2"/><circle cx="128" cy="140" r="30" fill="#D01E7E" stroke="none" stroke-width="0"/><text x="128" y="152" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="128" y="212" font-size="28" font-weight="800" fill="#2B1D1A" text-anchor="middle">복사</text><text x="128" y="254" font-size="20" font-weight="500" fill="#7A6A66" text-anchor="middle">상자 안의 문장을</text><text x="128" y="284" font-size="20" font-weight="500" fill="#7A6A66" text-anchor="middle">그대로 복사해요</text><line x1="232" y1="205" x2="252" y2="205" stroke="#D01E7E" stroke-width="5" stroke-linecap="round"/><polygon points="256,205 243.39374056706254,211.08951747755722 243.39374056706254,198.91048252244278" fill="#D01E7E"/><rect x="260" y="90" width="200" height="230" rx="20" fill="#FFFFFF" stroke="#E8D0DC" stroke-width="2"/><circle cx="360" cy="140" r="30" fill="#D01E7E" stroke="none" stroke-width="0"/><text x="360" y="152" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="360" y="212" font-size="28" font-weight="800" fill="#2B1D1A" text-anchor="middle">붙여넣기</text><text x="360" y="254" font-size="20" font-weight="500" fill="#7A6A66" text-anchor="middle">AI 대화창에</text><text x="360" y="284" font-size="20" font-weight="500" fill="#7A6A66" text-anchor="middle">붙여넣어요</text><line x1="464" y1="205" x2="484" y2="205" stroke="#D01E7E" stroke-width="5" stroke-linecap="round"/><polygon points="488,205 475.39374056706254,211.08951747755722 475.39374056706254,198.91048252244278" fill="#D01E7E"/><rect x="492" y="90" width="200" height="230" rx="20" fill="#FFFFFF" stroke="#E8D0DC" stroke-width="2"/><circle cx="592" cy="140" r="30" fill="#D01E7E" stroke="none" stroke-width="0"/><text x="592" y="152" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="592" y="212" font-size="28" font-weight="800" fill="#2B1D1A" text-anchor="middle">보내기</text><text x="592" y="254" font-size="20" font-weight="500" fill="#7A6A66" text-anchor="middle">[ ] 안만 내 내용으로</text><text x="592" y="284" font-size="20" font-weight="500" fill="#7A6A66" text-anchor="middle">바꾸고 보내요</text></svg>
