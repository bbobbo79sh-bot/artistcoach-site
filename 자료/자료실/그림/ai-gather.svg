<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="자료를 한 폴더에 모으기" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"><title>자료를 한 폴더에 모으기</title><desc>사진첩, 카톡·메일, 서랍 서류, 컴퓨터 자료를 내 예술활동 이력 폴더 하나에 모은다</desc><rect width="720" height="400" rx="22" fill="#FFF9FC"/><text x="360" y="48" font-size="30" font-weight="800" fill="#2B1D1A" text-anchor="middle">여기저기 흩어진 자료를 한 폴더로</text><rect x="60" y="100" width="270" height="58" rx="14" fill="#FFFFFF" stroke="#E8D0DC" stroke-width="2"/><rect x="74" y="108" width="30" height="42" rx="6" fill="#FFFFFF" stroke="#D01E7E" stroke-width="3"/><line x1="84" y1="124" x2="94" y2="124" stroke="#E8D0DC" stroke-width="4" stroke-linecap="round"/><line x1="84" y1="138" x2="94" y2="138" stroke="#E8D0DC" stroke-width="4" stroke-linecap="round"/><text x="122" y="138" font-size="24" font-weight="600" fill="#2B1D1A" text-anchor="start">휴대폰 사진첩</text><line x1="336" y1="129" x2="407.7532519194937" y2="234.69060080033532" stroke="#E8D0DC" stroke-width="5" stroke-linecap="round"/><polygon points="410,238 397.88106663752785,230.99061670644565 407.9573887708138,224.14981085449003" fill="#E8D0DC"/><rect x="60" y="178" width="270" height="58" rx="14" fill="#FFFFFF" stroke="#E8D0DC" stroke-width="2"/><rect x="74" y="186" width="30" height="42" rx="6" fill="#FFFFFF" stroke="#D01E7E" stroke-width="3"/><line x1="84" y1="202" x2="94" y2="202" stroke="#E8D0DC" stroke-width="4" stroke-linecap="round"/><line x1="84" y1="216" x2="94" y2="216" stroke="#E8D0DC" stroke-width="4" stroke-linecap="round"/><text x="122" y="216" font-size="24" font-weight="600" fill="#2B1D1A" text-anchor="start">카톡·메일 첨부</text><line x1="336" y1="207" x2="406.31064916058654" y2="236.4544611348403" stroke="#E8D0DC" stroke-width="5" stroke-linecap="round"/><polygon points="410,238 396.0198750618986,238.74572562988945 400.7256680277155,227.51254242116508" fill="#E8D0DC"/><rect x="60" y="256" width="270" height="58" rx="14" fill="#FFFFFF" stroke="#E8D0DC" stroke-width="2"/><rect x="74" y="264" width="30" height="42" rx="6" fill="#FFFFFF" stroke="#D01E7E" stroke-width="3"/><line x1="84" y1="280" x2="94" y2="280" stroke="#E8D0DC" stroke-width="4" stroke-linecap="round"/><line x1="84" y1="294" x2="94" y2="294" stroke="#E8D0DC" stroke-width="4" stroke-linecap="round"/><text x="122" y="294" font-size="24" font-weight="600" fill="#2B1D1A" text-anchor="start">서랍 속 종이 서류</text><line x1="336" y1="285" x2="406.6234765119546" y2="240.14454870186665" stroke="#E8D0DC" stroke-width="5" stroke-linecap="round"/><polygon points="410,238 402.6234839324457,249.89903402403377 396.09385053170087,239.61833462711638" fill="#E8D0DC"/><rect x="60" y="334" width="270" height="58" rx="14" fill="#FFFFFF" stroke="#E8D0DC" stroke-width="2"/><rect x="74" y="342" width="30" height="42" rx="6" fill="#FFFFFF" stroke="#D01E7E" stroke-width="3"/><line x1="84" y1="358" x2="94" y2="358" stroke="#E8D0DC" stroke-width="4" stroke-linecap="round"/><line x1="84" y1="372" x2="94" y2="372" stroke="#E8D0DC" stroke-width="4" stroke-linecap="round"/><text x="122" y="372" font-size="24" font-weight="600" fill="#2B1D1A" text-anchor="start">컴퓨터·외장하드</text><line x1="336" y1="363" x2="407.96230024932015" y2="241.4420603896619" stroke="#E8D0DC" stroke-width="5" stroke-linecap="round"/><polygon points="410,238 408.81817879953786,251.9500286254236 398.33793534871114,245.7457245025342" fill="#E8D0DC"/><path d="M430 182 Q430 170 442 170 H520 L536 186 H668 Q680 186 680 198 V308 Q680 320 668 320 H442 Q430 320 430 308 Z" fill="#FBE3EF" stroke="#D01E7E" stroke-width="3" stroke-linejoin="round"/><text x="555" y="250" font-size="28" font-weight="800" fill="#2B1D1A" text-anchor="middle">내 예술활동</text><text x="555" y="284" font-size="28" font-weight="800" fill="#2B1D1A" text-anchor="middle">이력</text><text x="555" y="352" font-size="22" font-weight="700" fill="#9B1560" text-anchor="middle">전부 이 폴더 안으로!</text></svg>
