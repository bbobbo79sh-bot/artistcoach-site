<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="엑셀 연혁표 예시" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"><title>엑셀 연혁표 예시</title><desc>날짜, 활동명, 역할, 증빙 파일, 확인 칸이 있는 표와 아래쪽 시트 탭 5개</desc><rect width="720" height="420" rx="22" fill="#FFF9FC"/><text x="360" y="46" font-size="30" font-weight="800" fill="#2B1D1A" text-anchor="middle">연혁표는 이런 엑셀 표예요 (예시)</text><rect x="30" y="80" width="660" height="46" rx="10" fill="#D01E7E" stroke="#D01E7E" stroke-width="2"/><text x="86" y="111" font-size="21" font-weight="800" fill="#FFFFFF" text-anchor="middle">날짜</text><text x="231" y="111" font-size="21" font-weight="800" fill="#FFFFFF" text-anchor="middle">활동명</text><text x="362" y="111" font-size="21" font-weight="800" fill="#FFFFFF" text-anchor="middle">역할</text><text x="479" y="111" font-size="21" font-weight="800" fill="#FFFFFF" text-anchor="middle">증빙 파일</text><text x="622" y="111" font-size="21" font-weight="800" fill="#FFFFFF" text-anchor="middle">확인</text><rect x="30" y="132" width="660" height="50" rx="10" fill="#FFFFFF" stroke="#E8D0DC" stroke-width="1.5"/><text x="86" y="165" font-size="20" font-weight="500" fill="#2B1D1A" text-anchor="middle">2024.05.18</text><text x="231" y="165" font-size="20" font-weight="500" fill="#2B1D1A" text-anchor="middle">봄소리음악회</text><text x="362" y="165" font-size="20" font-weight="500" fill="#2B1D1A" text-anchor="middle">출연</text><text x="479" y="165" font-size="20" font-weight="500" fill="#2B1D1A" text-anchor="middle">출연확인서</text><rect x="560" y="141" width="124" height="32" rx="16" fill="#D01E7E" stroke="#D01E7E" stroke-width="2"/><text x="622" y="165" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle">완료</text><rect x="30" y="188" width="660" height="50" rx="10" fill="#FDF2F8" stroke="#E8D0DC" stroke-width="1.5"/><text x="86" y="221" font-size="20" font-weight="500" fill="#2B1D1A" text-anchor="middle">2024.09.07</text><text x="231" y="221" font-size="20" font-weight="500" fill="#2B1D1A" text-anchor="middle">가을 마당놀이</text><text x="362" y="221" font-size="20" font-weight="500" fill="#2B1D1A" text-anchor="middle">연출</text><text x="479" y="221" font-size="20" font-weight="500" fill="#2B1D1A" text-anchor="middle">계약서</text><rect x="560" y="197" width="124" height="32" rx="16" fill="#FFFFFF" stroke="#9B1560" stroke-width="2"/><text x="622" y="221" font-size="19" font-weight="800" fill="#9B1560" text-anchor="middle">확인필요</text><rect x="30" y="244" width="660" height="50" rx="10" fill="#FFFFFF" stroke="#E8D0DC" stroke-width="1.5"/><text x="86" y="277" font-size="20" font-weight="500" fill="#2B1D1A" text-anchor="middle">2025.03.22</text><text x="231" y="277" font-size="20" font-weight="500" fill="#2B1D1A" text-anchor="middle">청년예술제</text><text x="362" y="277" font-size="20" font-weight="500" fill="#2B1D1A" text-anchor="middle">기획</text><text x="479" y="277" font-size="20" font-weight="500" fill="#7A6A66" text-anchor="middle">—</text><rect x="560" y="253" width="124" height="32" rx="16" fill="#FFFFFF" stroke="#7A6A66" stroke-width="2" stroke-dasharray="5 4"/><text x="622" y="277" font-size="19" font-weight="800" fill="#7A6A66" text-anchor="middle">빈칸</text><rect x="30" y="306" width="112" height="44" rx="10" fill="#FFFFFF" stroke="#D01E7E" stroke-width="3"/><text x="86" y="336" font-size="20" font-weight="800" fill="#D01E7E" text-anchor="middle">연혁표</text><rect x="150" y="306" width="136" height="44" rx="10" fill="#FBE3EF" stroke="#D01E7E" stroke-width="1.5"/><text x="218" y="336" font-size="20" font-weight="500" fill="#9B1560" text-anchor="middle">수상·선정</text><rect x="294" y="306" width="136" height="44" rx="10" fill="#FBE3EF" stroke="#D01E7E" stroke-width="1.5"/><text x="362" y="336" font-size="20" font-weight="500" fill="#9B1560" text-anchor="middle">교육·자격</text><rect x="438" y="306" width="136" height="44" rx="10" fill="#FBE3EF" stroke="#D01E7E" stroke-width="1.5"/><text x="506" y="336" font-size="20" font-weight="500" fill="#9B1560" text-anchor="middle">활동 수입</text><rect x="582" y="306" width="136" height="44" rx="10" fill="#FBE3EF" stroke="#D01E7E" stroke-width="1.5"/><text x="650" y="336" font-size="20" font-weight="500" fill="#9B1560" text-anchor="middle">링크</text><text x="360" y="388" font-size="22" font-weight="500" fill="#7A6A66" text-anchor="middle">엑셀 아래쪽 탭 5개 = 시트 5장</text></svg>
