<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" height="310" role="img" aria-label="이력 정리 5단계" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"><title>이력 정리 5단계</title><desc>모으기, 백업, 폴더 정리, 연혁표, 점검 순서</desc><rect width="720" height="310" rx="22" fill="#FFF9FC"/><text x="360" y="52" font-size="32" font-weight="800" fill="#2B1D1A" text-anchor="middle">이 글의 순서, 딱 5단계예요</text><line x1="86" y1="150" x2="634" y2="150" stroke="#E8D0DC" stroke-width="6" stroke-linecap="round"/><circle cx="86" cy="150" r="38" fill="#D01E7E" stroke="none" stroke-width="0"/><text x="86" y="162" font-size="36" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="232" font-size="28" font-weight="800" fill="#2B1D1A" text-anchor="middle">모으기</text><text x="86" y="270" font-size="22" font-weight="500" fill="#7A6A66" text-anchor="middle">한 폴더에</text><circle cx="223" cy="150" r="38" fill="#D01E7E" stroke="none" stroke-width="0"/><text x="223" y="162" font-size="36" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="223" y="232" font-size="28" font-weight="800" fill="#2B1D1A" text-anchor="middle">백업</text><text x="223" y="270" font-size="22" font-weight="500" fill="#7A6A66" text-anchor="middle">한 벌 더</text><circle cx="360" cy="150" r="38" fill="#D01E7E" stroke="none" stroke-width="0"/><text x="360" y="162" font-size="36" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="360" y="232" font-size="28" font-weight="800" fill="#2B1D1A" text-anchor="middle">폴더 정리</text><text x="360" y="270" font-size="22" font-weight="500" fill="#7A6A66" text-anchor="middle">AI가 나눠요</text><circle cx="497" cy="150" r="38" fill="#D01E7E" stroke="none" stroke-width="0"/><text x="497" y="162" font-size="36" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="497" y="232" font-size="28" font-weight="800" fill="#2B1D1A" text-anchor="middle">연혁표</text><text x="497" y="270" font-size="22" font-weight="500" fill="#7A6A66" text-anchor="middle">엑셀 한 장</text><circle cx="634" cy="150" r="38" fill="#D01E7E" stroke="none" stroke-width="0"/><text x="634" y="162" font-size="36" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="634" y="232" font-size="28" font-weight="800" fill="#2B1D1A" text-anchor="middle">점검</text><text x="634" y="270" font-size="22" font-weight="500" fill="#7A6A66" text-anchor="middle">내 눈으로</text></svg>
