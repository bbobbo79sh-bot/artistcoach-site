<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-label="확인 칸 사용법" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"><title>확인 칸 사용법</title><desc>증빙이 있으면 확인필요에서 완료로, 증빙이 없으면 빈칸으로 두고 확인서를 요청한다</desc><rect width="720" height="350" rx="22" fill="#FFF9FC"/><text x="360" y="48" font-size="30" font-weight="800" fill="#2B1D1A" text-anchor="middle">'확인' 칸이 숨은 주인공이에요</text><rect x="30" y="90" width="320" height="230" rx="20" fill="#FFFFFF" stroke="#E8D0DC" stroke-width="2"/><text x="190" y="130" font-size="24" font-weight="800" fill="#2B1D1A" text-anchor="middle">증빙이 있을 때</text><rect x="70" y="150" width="120" height="40" rx="20" fill="#FFFFFF" stroke="#9B1560" stroke-width="2"/><text x="130" y="178" font-size="20" font-weight="800" fill="#9B1560" text-anchor="middle">확인필요</text><line x1="196" y1="170" x2="232" y2="170" stroke="#D01E7E" stroke-width="5" stroke-linecap="round"/><polygon points="236,170 223.39374056706254,176.08951747755722 223.39374056706254,163.91048252244278" fill="#D01E7E"/><rect x="240" y="150" width="80" height="40" rx="20" fill="#D01E7E" stroke="#D01E7E" stroke-width="2"/><text x="280" y="178" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">완료</text><text x="190" y="232" font-size="21" font-weight="500" fill="#7A6A66" text-anchor="middle">AI가 적어 준 줄</text><text x="190" y="262" font-size="21" font-weight="500" fill="#7A6A66" text-anchor="middle">내가 원본과 맞는지</text><text x="190" y="292" font-size="21" font-weight="700" fill="#9B1560" text-anchor="middle">눈으로 보고 "완료"로!</text><rect x="370" y="90" width="320" height="230" rx="20" fill="#FFFFFF" stroke="#E8D0DC" stroke-width="2"/><text x="530" y="130" font-size="24" font-weight="800" fill="#2B1D1A" text-anchor="middle">증빙이 없을 때</text><rect x="430" y="150" width="200" height="40" rx="20" fill="#FFFFFF" stroke="#7A6A66" stroke-width="2" stroke-dasharray="6 5"/><text x="530" y="178" font-size="20" font-weight="800" fill="#7A6A66" text-anchor="middle">빈칸</text><text x="530" y="232" font-size="21" font-weight="500" fill="#7A6A66" text-anchor="middle">지금 담당 기관에</text><text x="530" y="262" font-size="21" font-weight="700" fill="#9B1560" text-anchor="middle">확인서를 요청해 두세요</text><text x="530" y="292" font-size="21" font-weight="500" fill="#7A6A66" text-anchor="middle">시간이 갈수록 어려워져요</text></svg>
