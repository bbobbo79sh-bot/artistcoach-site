# 검수용 사이트(staging.artistcoach.kr)를 만드는 설정. 별도 저장소(예: artistcoach-staging)의 .github/workflows/ 에 이 파일을 넣는다.
# 진짜 사이트 저장소(artistcoach-site, 공개)의 코드를 받아 '검수용 모드'로 만든다:
#   상품·결제창 페이지가 켜지고, 모든 페이지가 검색에서 숨겨지고(noindex·robots 차단), 광고 코드는 들어가지 않는다.
# 진짜 사이트(artistcoach.kr)에는 아무 영향이 없다. 비밀 키는 필요 없다(공개 저장소를 읽기만 한다).
name: 검수용 사이트 만들어 올리기

on:
  schedule:
    - cron: '45 22 * * *'     # 매일 한국시간 07:45 (진짜 사이트 07:30 뒤)
  workflow_dispatch:           # 손으로 돌릴 때(Actions 탭의 Run workflow)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bbobbo79sh-bot/artistcoach-site
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 검수용으로 만들기
        run: node 만들기.js
        env:
          TZ: Asia/Seoul
          SITE_STAGING: '1'
          SITE_CNAME: staging.artistcoach.kr
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 결과

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
