name: 사이트 만들어 올리기

# 언제 돌아가나
#   - 공고 자료(자료/공고.json)나 사이트 파일을 올렸을 때
#   - 매일 아침 7시 30분(한국시간): 마감 지난 공고를 사이트에서 정리하고 D-day 를 오늘 기준으로 새로 만든다
#   - 손으로 돌리고 싶을 때(Actions 탭의 Run workflow)
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 22 * * *'     # UTC 22:30 = 한국시간 07:30
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 사이트 만들기
        run: node 만들기.js
        env:
          TZ: Asia/Seoul                 # 날짜 계산을 한국 기준으로
          SITE_BASE: ${{ vars.SITE_BASE }}   # 도메인(artistcoach.kr) 연결 전에는 /artistcoach-site, 연결 뒤에는 비움
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 결과

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
